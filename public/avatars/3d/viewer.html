<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>角色 3D 模型检视台</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161a;
        color: #e8eaed;
      }
      #app {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
        padding: 12px;
      }
      .cell {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #1d2026;
        border: 1px solid #2a2e36;
      }
      .cell h3 {
        position: absolute;
        left: 10px;
        top: 8px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .cell .meta {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        color: #9aa3af;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .cell canvas {
        display: block;
        width: 100%;
        height: 380px;
      }
      #status {
        padding: 8px 12px;
        font-size: 12px;
        color: #9aa3af;
        border-bottom: 1px solid #2a2e36;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">加载中…</div>
    <div id="app"></div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const MANIFEST = [
        ['visionary_01', '科技远见者'],
        ['legend_01', '传奇产品人'],
        ['master_01', '供应链大师'],
        ['pioneer_01', '加密先锋'],
        ['investor_01', '价值投资者'],
        ['analyst_01', '投行分析师'],
        ['consultant_01', '战略顾问'],
        ['brand_01', '品牌总监'],
        ['ops_01', '运营总监'],
        ['expert_01', '行业专家'],
        ['hr_01', '招聘经理'],
        ['tech_01', '技术面试官'],
        ['host_01', '主持面试官'],
      ];

      const params = new URLSearchParams(location.search);
      const only = params.get('id');
      const statusEl = document.getElementById('status');
      const app = document.getElementById('app');
      const loader = new GLTFLoader();
      const results = [];
      window.__avatarModels = results;

      const list = only ? MANIFEST.filter(([id]) => id === only) : MANIFEST;

      function makeCell(id, name) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const title = document.createElement('h3');
        title.textContent = `${name} · ${id}`;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = '加载中…';
        cell.appendChild(meta);
        app.appendChild(cell);
        return { cell, meta };
      }

      function sceneFor(canvas) {
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1d2026);

        const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
        camera.position.set(0, 1.15, 2.2);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x2b3038, 1.4));
        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(2.2, 3.4, 2.6);
        key.castShadow = true;
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xa9c7ff, 0.9);
        fill.position.set(-2.4, 1.6, 1.4);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffd9a8, 0.8);
        rim.position.set(0.4, 2.2, -2.6);
        scene.add(rim);

        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(3, 48),
          new THREE.MeshStandardMaterial({ color: 0x242830, roughness: 0.95, metalness: 0 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.target.set(0, 1.05, 0);
        controls.minDistance = 0.8;
        controls.maxDistance = 6;
        controls.enablePan = false;

        return { renderer, scene, camera, controls };
      }

      function fitModel(root, { camera, controls }) {
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const radius = Math.max(sphere.radius, 0.05);
        const fov = (camera.fov * Math.PI) / 180;
        // 垂直方向要装得下整个 bust：按 bbox 高度算距离，而不是只看包围球
        const distV = size.y / 2 / Math.tan(fov / 2);
        const distH = size.x / 2 / Math.tan(Math.atan(Math.tan(fov / 2) * camera.aspect));
        const dist = Math.max(distV, distH, radius / Math.sin(fov / 2)) * 1.12;
        // 脚底贴地、水平居中
        root.position.set(-center.x, -box.min.y, -center.z);
        const midY = size.y * 0.5;
        camera.position.set(0, midY * 0.96, dist);
        camera.near = Math.max(0.01, dist - radius * 3);
        camera.far = dist + radius * 5;
        camera.updateProjectionMatrix();
        controls.target.set(0, midY * 0.92, 0);
        controls.minDistance = radius * 0.6;
        controls.maxDistance = dist * 2.5;
        controls.update();
        return { size, radius };
      }

      let pending = list.length;

      function done() {
        pending -= 1;
        if (pending > 0) return;
        statusEl.textContent = `就绪：${results.filter((r) => r.ok).length}/${results.length} 个角色模型已加载`;
        window.__ready = true;
      }

      for (const [id, name] of list) {
        const { cell, meta } = makeCell(id, name);
        const canvas = document.createElement('canvas');
        cell.insertBefore(canvas, meta);

        const ctx = sceneFor(canvas);
        const resize = () => {
          const w = canvas.clientWidth || 320;
          const h = canvas.clientHeight || 380;
          ctx.renderer.setSize(w, h, false);
          ctx.camera.aspect = w / h;
          ctx.camera.updateProjectionMatrix();
        };
        resize();
        addEventListener('resize', resize);

        const clock = new THREE.Clock();
        const tick = () => {
          const dt = clock.getDelta();
          const mixer = ctx.mixer;
          if (mixer) mixer.update(dt);
          ctx.controls.update();
          ctx.renderer.render(ctx.scene, ctx.camera);
          requestAnimationFrame(tick);
        };
        tick();

        loader.load(
          `/avatars/3d/${id}.glb`,
          (gltf) => {
            const root = gltf.scene;
            root.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
            ctx.scene.add(root);
            fitModel(root, ctx);
            if (gltf.animations?.length) {
              ctx.mixer = new THREE.AnimationMixer(root);
              ctx.mixer.clipAction(gltf.animations[0]).play();
            }
            meta.textContent = `${gltf.animations?.length ? `动画 ${gltf.animations[0].name}` : '无动画'} · ${
              (root.children.length || 0)
            } 个节点`;
            results.push({ id, ok: true, animations: (gltf.animations || []).map((a) => a.name) });
            done();
          },
          (evt) => {
            if (evt.total) meta.textContent = `下载中 ${Math.round((evt.loaded / evt.total) * 100)}%`;
          },
          (err) => {
            meta.textContent = `加载失败：${err?.message ?? err}`;
            results.push({ id, ok: false, error: String(err?.message ?? err) });
            done();
          },
        );
      }
    </script>
  </body>
</html>
